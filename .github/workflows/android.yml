name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du cœur (CCID, carte, .DDD, activités)
        run: ./gradlew -p core test --console=plain

      - name: Compilation de l'APK
        run: ./gradlew :app:assembleDebug --console=plain

      # Vérification seulement : les APK à installer sont signés localement avec la clé privée
      # (un APK signé avec la clé de test ne peut pas mettre à jour l'application installée).
      - name: Tests de l'application
        run: ./gradlew :app:testDebugUnitTest --console=plain
