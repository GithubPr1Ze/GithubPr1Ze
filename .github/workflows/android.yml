name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du cœur (CCID, carte, .DDD, activités)
        run: ./gradlew -p core test --console=plain

      - name: Compilation de l'APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TachoPerso-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TachoPerso-apk
          path: TachoPerso-${{ github.run_number }}.apk

      # Publication en « pré-version » pour télécharger l'APK directement depuis le téléphone.
      - name: Publier l'APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tacho Perso (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            APK de test compilé depuis `${{ github.ref_name }}` (${{ github.sha }}).
            Téléchargez `TachoPerso-${{ github.run_number }}.apk` sur le téléphone et installez-le.
          files: TachoPerso-${{ github.run_number }}.apk
